<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>حياتك قرار VR</title>
<style>
  :root{--bg:#05070a;--fg:#f3efe6;--muted:#a9b0ba;--accent:#3f8f3a;--gold:#c99a2e;--panel:rgba(10,14,20,.86)}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
    font-family:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
  [hidden]{display:none!important}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
    background:radial-gradient(ellipse at 70% 30%,rgba(201,154,46,.25),transparent 60%),radial-gradient(ellipse at 20% 40%,rgba(60,70,90,.5),transparent 60%),var(--bg)}
  .card{max-width:440px;width:100%;display:grid;gap:14px;text-align:center}
  h1{margin:0;font-size:clamp(34px,9vw,52px);line-height:1.1}
  h1 .g{color:#4fae46}
  .sub{margin:0;color:var(--gold);font-size:18px}
  ol{margin:0;padding:0 20px 0 0;text-align:right;color:var(--muted);font-size:15px;line-height:1.8}
  button{font:inherit;cursor:pointer;border:0;border-radius:12px}
  #start{background:var(--accent);color:#fff;font-size:20px;padding:14px 18px;font-weight:700}
  #start:focus-visible,.row button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .row button{background:#1b222c;color:var(--fg);padding:9px 12px;font-size:14px}
  .row button[aria-pressed="true"]{background:#2c3a26;outline:1px solid #4fae46}
  #msg{min-height:1.4em;color:#e9b44c;font-size:14px;margin:0}
  #hint{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--panel);padding:6px 12px;border-radius:999px;font-size:13px;color:var(--muted);transition:opacity 1s}
  #rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:var(--bg);font-size:20px;padding:24px}
  @media (orientation:portrait){body.running #rotate{display:flex}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="intro">
  <div class="card">
    <h1>حياتك <span class="g">قرار</span></h1>
    <p class="sub">تجربة الواقع الافتراضي</p>
    <ol>
      <li>اضغط «ابدأ» واسمح باستخدام حساس الحركة.</li>
      <li>اقلب الجوال بالعرض وركّبه في النظارة.</li>
      <li>لف رأسك يمين ويسار. للتوسيط من جديد: المس الشاشة.</li>
    </ol>
    <div class="row" role="group" aria-label="مجال الرؤية">
      <button id="fov80" type="button" aria-pressed="false">رؤية ضيقة</button>
      <button id="fov95" type="button" aria-pressed="true">رؤية متوسطة</button>
      <button id="fov110" type="button" aria-pressed="false">رؤية واسعة</button>
    </div>
    <div class="row">
      <button id="swap" type="button" aria-pressed="false">تبديل العينين</button>
      <button id="mono" type="button" aria-pressed="false">بدون 3D</button>
    </div>
    <button id="start" type="button">ابدأ التجربة</button>
    <p id="msg" role="status"></p>
  </div>
</div>
<div id="hint" hidden>المس الشاشة لتوسيط المشهد • مرتين للخروج</div>
<div id="rotate" hidden>اقلب الجوال بالعرض ↻</div>

const canvas=document.getElementById('c');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false});
const msg=document.getElementById('msg');
if(!gl){msg.textContent='المتصفح لا يدعم WebGL2. جرّب Safari أو Chrome محدّث.';return;}

const vs=`#version 300 es
in vec2 p; out vec2 uv; void main(){uv=p*.5+.5; gl_Position=vec4(p,0,1);}`;
const fs=`#version 300 es
precision highp float;
in vec2 uv; out vec4 o;
uniform sampler2D img, dep;
uniform mat3 R;           // head rotation (camera -> world)
uniform float tanX, tanY, eye, time, flash, glow;
const float PI=3.14159265;
const float HFOV=PI;          // image spans 180 degrees
const float HC=PI/1.5*1.25;   // cylinder height (aspect 1.5, vertical stretch 1.25)
vec2 toImg(float lam,float phi){ return vec2(lam/HFOV+.5, .5 - tan(clamp(phi,-1.45,1.45))/HC); }
void main(){
  vec3 d=normalize(vec3((uv.x*2.-1.)*tanX,(uv.y*2.-1.)*tanY,-1.));
  d=R*d;
  float lam=atan(d.x,-d.z), phi=asin(clamp(d.y,-1.,1.));
  // behind the viewer: dark
  float back=smoothstep(PI*.5-.14,PI*.5+.02,abs(lam));
  vec2 t0=toImg(lam,phi);
  float dp=texture(dep,clamp(t0,0.,1.)).r*pow(cos(phi),2.);
  float disp=radians(1.4)*dp;
  vec2 t=toImg(lam-eye*disp*.5,phi);
  vec2 tc=clamp(t,vec2(0.),vec2(1.));
  float inside=clamp(min(t.y,1.-t.y)*25.+1.,0.,1.);
  vec3 sharp=texture(img,tc).rgb;
  vec3 soft=textureLod(img,tc,6.).rgb*.8;
  vec3 col=mix(soft,sharp,inside);
  // sun glow (image space)
  vec2 sp=(tc-vec2(1310./1536.,460./1024.))*vec2(1.5,1.);
  col+=vec3(1.,.78,.43)*glow*exp(-dot(sp,sp)/(2.*.137*.137));
  // lightning on dark side
  float lm=pow(clamp((.55-tc.x)/.55,0.,1.),1.5)*clamp(1.-tc.y*1.2,0.,1.);
  col+=vec3(.67,.75,1.)*flash*lm;
  col*=pow(max(cos(phi),0.),.6);
  col=mix(col,vec3(0.),back);
  o=vec4(col,1.);
}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);
  if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(x);return x;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(pr);gl.useProgram(pr);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U={};['img','dep','R','tanX','tanY','eye','time','flash','glow'].forEach(n=>U[n]=gl.getUniformLocation(pr,n));

function tex(src,unit,mip){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{
  const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  if(mip){gl.generateMipmap(gl.TEXTURE_2D);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);}
  else gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  res();};im.onerror=rej;im.src=src;});}
const ready=Promise.all([tex(IMG_SRC,0,true),tex(DEPTH_SRC,1,false)]);
gl.uniform1i(U.img,0);gl.uniform1i(U.dep,1);

// ---------- orientation ----------
let q=[0,0,0,1];           // device quaternion (x,y,z,w)
let yaw0=0, hasSensor=false, dragYaw=0, dragPitch=0;
function qmul(a,b){return[a[3]*b[0]+a[0]*b[3]+a[1]*b[2]-a[2]*b[1],a[3]*b[1]-a[0]*b[2]+a[1]*b[3]+a[2]*b[0],
  a[3]*b[2]+a[0]*b[1]-a[1]*b[0]+a[2]*b[3],a[3]*b[3]-a[0]*b[0]-a[1]*b[1]-a[2]*b[2]];}
function eulerYXZ(x,y,z){const c1=Math.cos(x/2),c2=Math.cos(y/2),c3=Math.cos(z/2),s1=Math.sin(x/2),s2=Math.sin(y/2),s3=Math.sin(z/2);
  return[s1*c2*c3+c1*s2*s3,c1*s2*c3-s1*c2*s3,c1*c2*s3-s1*s2*c3,c1*c2*c3+s1*s2*s3];}
const Q1=[-Math.SQRT1_2,0,0,Math.SQRT1_2];
function screenAngle(){const a=(screen.orientation&&typeof screen.orientation.angle==='number')?screen.orientation.angle:(window.orientation||0);return a*Math.PI/180;}
function onOri(e){if(e.alpha==null)return;hasSensor=true;const D=Math.PI/180;
  let r=eulerYXZ(e.beta*D,e.alpha*D,-e.gamma*D);r=qmul(r,Q1);const o=-screenAngle();
  r=qmul(r,[0,0,Math.sin(o/2),Math.cos(o/2)]);q=r;}
function mat(qq){const[x,y,z,w]=qq;return[1-2*(y*y+z*z),2*(x*y+z*w),2*(x*z-y*w),2*(x*y-z*w),1-2*(x*x+z*z),2*(y*z+x*w),2*(x*z+y*w),2*(y*z-x*w),1-2*(x*x+y*y)];}
function forwardYaw(){const m=mat(q);const fx=-m[6],fz=-m[8];return Math.atan2(fx,-fz);}  // column 2 negated
function recenter(){yaw0=hasSensor?forwardYaw():0;dragYaw=0;dragPitch=0;}
function headQuat(){
  let base;
  if(hasSensor) base=q;
  else{base=qmul([0,Math.sin(dragYaw/2),0,Math.cos(dragYaw/2)],[Math.sin(dragPitch/2),0,0,Math.cos(dragPitch/2)]);}
  return qmul([0,Math.sin(yaw0/2),0,Math.cos(yaw0/2)],base);
}

// ---------- settings ----------
let vfovDeg=95, swap=false, mono=false;
const fovBtns={fov80:80,fov95:95,fov110:110};
Object.keys(fovBtns).forEach(id=>document.getElementById(id).onclick=()=>{vfovDeg=fovBtns[id];
  Object.keys(fovBtns).forEach(k=>document.getElementById(k).setAttribute('aria-pressed',k===id));});
document.getElementById('swap').onclick=e=>{swap=!swap;e.currentTarget.setAttribute('aria-pressed',swap);};
document.getElementById('mono').onclick=e=>{mono=!mono;e.currentTarget.setAttribute('aria-pressed',mono);};

// ---------- start ----------
let running=false, wake=null;
document.getElementById('start').onclick=async()=>{
  msg.textContent='';
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r!=='granted')msg.textContent='لم يُسمح بحساس الحركة. يمكنك السحب بالإصبع للتجربة.';
    }
  }catch(err){msg.textContent='تعذّر طلب حساس الحركة. افتح الصفحة عبر رابط https.';}
  window.addEventListener('deviceorientation',onOri);
  try{const el=document.documentElement;if(el.requestFullscreen)await el.requestFullscreen();}catch(e){}
  try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');}catch(e){}
  try{if(navigator.wakeLock)wake=await navigator.wakeLock.request('screen');}catch(e){}
  await ready;
  document.getElementById('intro').hidden=true;
  document.body.classList.add('running');document.getElementById('rotate').hidden=false;
  const hint=document.getElementById('hint');hint.hidden=false;setTimeout(()=>hint.style.opacity=0,5000);
  running=true;setTimeout(recenter,600);requestAnimationFrame(frame);
};
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&running&&navigator.wakeLock){try{wake=await navigator.wakeLock.request('screen');}catch(e){}}});

// tap = recenter, double tap = back to menu, drag = look (no sensor)
let lastTap=0,dragging=false,px=0,py=0,moved=0;
canvas.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;moved=0;});
window.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  if(!hasSensor){dragYaw+=dx*.005;dragPitch=Math.max(-1.2,Math.min(1.2,dragPitch+dy*.005));}});
window.addEventListener('pointerup',()=>{if(!dragging)return;dragging=false;if(moved>10)return;
  const now=performance.now();
  if(now-lastTap<350){running=false;document.getElementById('intro').hidden=false;document.body.classList.remove('running');
    try{if(document.fullscreenElement)document.exitFullscreen();}catch(e){}}
  else if(hasSensor)recenter();
  lastTap=now;});

// ---------- render ----------
const flashes=[[3.2,.32],[9.5,.22],[9.9,.18],[15.8,.28]];
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(ts){
  if(!running)return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const W=Math.round(canvas.clientWidth*dpr),H=Math.round(canvas.clientHeight*dpr);
  if(canvas.width!==W||canvas.height!==H){canvas.width=W;canvas.height=H;}
  const sec=(ts/1000)%20;
  let L=0;if(!reduce)for(const[ft,a]of flashes){const d=sec-ft;if(d>=0&&d<.5)L+=a*Math.exp(-d*9)*(1+.5*Math.sin(d*60));}
  gl.uniform1f(U.flash,L);gl.uniform1f(U.glow,.10+.05*Math.sin(2*Math.PI*sec/10));
  gl.uniformMatrix3fv(U.R,false,mat(headQuat()));
  const halfW=Math.floor(W/2),tanY=Math.tan(vfovDeg*Math.PI/360);
  gl.uniform1f(U.tanY,tanY);gl.uniform1f(U.tanX,tanY*halfW/H);
  for(let i=0;i<2;i++){
    gl.viewport(i*halfW,0,halfW,H);
    let s=i===0?1:-1; if(swap)s=-s; if(mono)s=0;
    gl.uniform1f(U.eye,s);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
  requestAnimationFrame(frame);
}
})();
</script>
